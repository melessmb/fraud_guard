name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1 — Tests backend (pytest + SQLite in-memory)
  # ────────────────────────────────────────────────────────────
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx pydantic[email]

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./test.db"
          REDIS_URL: "redis://localhost:6379"
          KEYCLOAK_URL: "http://localhost:8080"
          KEYCLOAK_REALM: "fraudguard"
          KEYCLOAK_CLIENT_ID: "fraudguard-api"
          KEYCLOAK_CLIENT_SECRET: "test-secret"
          SECRET_KEY: "test-secret-key-for-ci-only"
          ENVIRONMENT: "test"
        run: |
          python -m pytest tests/ -v --tb=short --no-header \
            -p no:warnings \
            --ignore=tests/__pycache__

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: backend/.pytest_cache/

  # ────────────────────────────────────────────────────────────
  # Job 2 — Type check + build frontend (Next.js)
  # ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8780"
          NEXT_PUBLIC_KEYCLOAK_URL: "http://localhost:8080"
        run: npm run build

  # ────────────────────────────────────────────────────────────
  # Job 3 — Commitlint (convention des messages de commit)
  # ────────────────────────────────────────────────────────────
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier les messages de commit
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  # ────────────────────────────────────────────────────────────
  # Job 4 — Lint frontend (ESLint)
  # ────────────────────────────────────────────────────────────
  lint:
    name: Frontend — lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint
